# zmail 前端入口 nginx 配置（HTTPS）
# 证书放 ./certs/ 下：fullchain.pem 与 privkey.pem（由 nginx/entrypoint.sh 检测）
# HTTPS 对外端口：${ZMAIL_HTTPS_PORT}（compose 默认 22345:443），80 端口负责 ACME 校验与 301 跳转。
# ${ZMAIL_DOMAIN} / ${ZMAIL_HTTPS_PORT} 由 nginx/entrypoint.sh 用 envsubst 注入。

log_format zmail '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

upstream zmail_app {
    server app:3000;
    keepalive 16;
}

# :80 —— 仅 ACME 校验 + 跳转 HTTPS（跳转目标用固定域名，避免 Host 头注入开放重定向）
server {
    listen 80;
    server_name ${ZMAIL_DOMAIN};
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${ZMAIL_DOMAIN}:${ZMAIL_HTTPS_PORT}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${ZMAIL_DOMAIN};
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # 邮件正文由后端 sanitize-html 清洗，这里再加一层 CSP 兜底（Antd 需要 inline style）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:; manifest-src 'self'" always;

    client_max_body_size 60m;
    access_log /var/log/nginx/access.log zmail;

    # ---- 压缩 ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml application/manifest+json application/octet-stream;

    # 带内容哈希的静态资源长缓存（隐藏上游的 max-age=0，避免每次回源校验）
    location ^~ /assets/ {
        proxy_pass http://zmail_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        expires 365d;
    }

    location / {
        proxy_pass http://zmail_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # SSE 实时推送：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
