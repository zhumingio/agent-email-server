# zmail 前端入口 nginx 配置 —— HTTP 模式（未放置 TLS 证书时自动启用）
# 把 fullchain.pem / privkey.pem 放进 ./certs/ 并重建 nginx 服务后，将自动切换为 HTTPS。
# ${ZMAIL_DOMAIN} / ${ZMAIL_HTTPS_PORT} 由 nginx/entrypoint.sh 用 envsubst 注入。

log_format zmail '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

upstream zmail_app {
    server app:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name ${ZMAIL_DOMAIN};
    server_tokens off;

    client_max_body_size 60m;
    access_log /var/log/nginx/access.log zmail;

    # ACME HTTP-01 校验目录（证书签发/续期由 certbot 写入 ./data/acme-webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://zmail_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 实时推送：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
