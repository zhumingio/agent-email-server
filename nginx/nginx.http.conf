# zmail 前端入口 nginx 配置 —— HTTP 模式（未放置 TLS 证书时自动启用）
# 把 fullchain.pem / privkey.pem 放进 ./certs/ 并重建 nginx 服务后，将自动切换为 HTTPS。

upstream zmail_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    location / {
        proxy_pass http://zmail_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 实时推送：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
